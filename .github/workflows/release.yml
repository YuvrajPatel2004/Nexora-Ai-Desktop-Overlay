name: Build & Publish Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libnotify-bin

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web App & Electron TypeScript
        run: npm run build

      - name: Package Binaries for Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Package Binaries for macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Package Binaries for Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb --publish never

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
